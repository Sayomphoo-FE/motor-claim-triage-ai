services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: motor-claim-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: motor-claim-app
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - .env
    ports:
      - "8501:8501"
    profiles:
      - app  # only runs when `--profile app`; dev usually runs Streamlit on host

volumes:
  qdrant_storage:
