[project]
name = "motor-claim-triage-ai"
version = "0.1.0"
description = "AI assistant that performs initial triage on motor insurance claims (POC)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Sayomphoo Yongpadcha" }
]
dependencies = [
    "anthropic>=0.40.0",
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0",
    "pydantic>=2.9.0",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "faster-whisper>=1.2.1",
    "edge-tts>=7.3.1",
    "pydub>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
